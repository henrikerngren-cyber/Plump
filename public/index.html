<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Plump</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --c-felt:    #1a4a2e;
      --c-felt-dk: #0f2e1c;
      --c-felt-lt: #255a38;
      --c-card:    #fafaf8;
      --c-red:     #c0392b;
      --c-gold:    #d4af37;
      --c-gold-lt: #f0d060;
      --c-muted:   #6b8c7a;
      --r-btn: 999px;
      --f-display: 'Playfair Display', serif;
      --f-body: 'Inter', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--f-body);
      background: var(--c-felt-dk);
      min-height: 100dvh;
      color: var(--c-card);
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.02) 1px, transparent 1px),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
      z-index: 0;
    }
    #app {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 40px;
    }
    .logo-wrap { text-align: center; padding: 32px 0 20px; }
    .logo-suits { font-size: 22px; letter-spacing: 8px; color: var(--c-gold); margin-bottom: 6px; }
    .logo-suits span.red { color: var(--c-red); }
    h1.logo {
      font-family: var(--f-display);
      font-size: 56px; font-weight: 900;
      color: var(--c-card); letter-spacing: -1px; line-height: 1;
      text-shadow: 0 2px 16px rgba(0,0,0,0.4);
    }
    h1.logo em { color: var(--c-gold); font-style: normal; }
    .logo-tagline { font-size: 13px; color: var(--c-muted); margin-top: 6px; letter-spacing: 2px; text-transform: uppercase; }
    .panel {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; padding: 24px 20px;
      width: 100%; max-width: 420px;
      backdrop-filter: blur(8px);
    }
    .panel + .panel { margin-top: 16px; }
    .panel-title { font-family: var(--f-display); font-size: 20px; color: var(--c-gold); margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--c-muted); margin-bottom: 6px; }
    input[type="text"] {
      width: 100%; padding: 14px 16px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px; color: var(--c-card);
      font-size: 16px; font-family: var(--f-body);
      outline: none; transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    input[type="text"]:focus { border-color: var(--c-gold); }
    input[type="text"]::placeholder { color: var(--c-muted); }
    .btn {
      display: block; width: 100%; padding: 16px;
      border: none; border-radius: var(--r-btn);
      font-family: var(--f-body); font-size: 15px; font-weight: 600;
      cursor: pointer; transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s;
      letter-spacing: 0.5px; -webkit-appearance: none;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: linear-gradient(135deg, var(--c-gold), var(--c-gold-lt)); color: var(--c-felt-dk); }
    .btn-secondary { background: rgba(255,255,255,0.08); color: var(--c-card); border: 1px solid rgba(255,255,255,0.2); }
    .btn-ready { background: linear-gradient(135deg, #27ae60, #2ecc71); color: #fff; }
    .btn-ready.is-ready { background: rgba(255,255,255,0.08); color: var(--c-muted); border: 1px solid rgba(255,255,255,0.15); }
    .btn-start { background: linear-gradient(135deg, var(--c-gold), var(--c-gold-lt)); color: var(--c-felt-dk); font-size: 17px; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn + .btn { margin-top: 10px; }
    .settings-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .settings-row label { margin: 0; flex: 1; font-size: 13px; }
    .stepper { display: flex; align-items: center; background: rgba(0,0,0,0.3); border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); overflow: hidden; }
    .stepper button { background: none; border: none; color: var(--c-gold); font-size: 20px; width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .stepper-val { width: 36px; text-align: center; font-weight: 700; font-size: 16px; color: var(--c-card); }
    .player-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .player-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: rgba(0,0,0,0.2); border-radius: 10px; border: 1px solid rgba(255,255,255,0.07); transition: border-color 0.3s; }
    .player-item.is-ready { border-color: rgba(39,174,96,0.5); }
    .player-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--c-felt-lt); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: var(--c-gold); flex-shrink: 0; text-transform: uppercase; }
    .player-name { flex: 1; font-weight: 500; font-size: 15px; }
    .player-badge { font-size: 11px; font-weight: 600; letter-spacing: 0.5px; padding: 3px 8px; border-radius: 999px; }
    .badge-host { background: rgba(212,175,55,0.2); color: var(--c-gold); border: 1px solid rgba(212,175,55,0.3); }
    .badge-ready { background: rgba(39,174,96,0.2); color: #2ecc71; border: 1px solid rgba(39,174,96,0.3); }
    .badge-waiting { background: rgba(255,255,255,0.05); color: var(--c-muted); border: 1px solid rgba(255,255,255,0.1); }
    .invite-box { background: rgba(0,0,0,0.25); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; border: 1px dashed rgba(212,175,55,0.3); }
    .invite-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--c-muted); margin-bottom: 6px; }
    .invite-link-row { display: flex; align-items: center; gap: 8px; }
    .invite-link { flex: 1; font-size: 13px; color: var(--c-gold-lt); word-break: break-all; line-height: 1.4; }
    .copy-btn { background: rgba(212,175,55,0.15); border: 1px solid rgba(212,175,55,0.3); border-radius: 8px; color: var(--c-gold); padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .error-msg { background: rgba(231,76,60,0.15); border: 1px solid rgba(231,76,60,0.3); border-radius: 8px; color: #e74c3c; padding: 10px 14px; font-size: 14px; margin-bottom: 12px; display: none; }
    .error-msg.show { display: block; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--c-muted); font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(30,50,40,0.95); border: 1px solid var(--c-gold); border-radius: 999px; color: var(--c-gold); padding: 12px 24px; font-size: 14px; font-weight: 600; z-index: 100; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); white-space: nowrap; pointer-events: none; }
    #toast.show { transform: translateX(-50%) translateY(0); }
    .waiting-dot { display: inline-block; animation: blink 1.4s infinite both; }
    .waiting-dot:nth-child(2) { animation-delay: 0.2s; }
    .waiting-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }
    .screen { display: none; width: 100%; max-width: 420px; }
    .screen.active { display: flex; flex-direction: column; align-items: center; }
    .name-prompt { background: rgba(0,0,0,0.4); border: 1px solid rgba(212,175,55,0.3); border-radius: 12px; padding: 24px 20px; width: 100%; max-width: 420px; }
  </style>
</head>
<body>
<div id="app">
  <div class="logo-wrap">
    <div class="logo-suits"><span>♠</span><span class="red">♥</span><span>♣</span><span class="red">♦</span></div>
    <h1 class="logo">Pl<em>u</em>mp</h1>
    <p class="logo-tagline">Det svenska kortspelet</p>
  </div>

  <!-- SKÄRM 1: Start -->
  <div id="screen-start" class="screen active">
    <div class="panel">
      <p class="panel-title">Välkommen!</p>
      <div style="margin-bottom:16px">
        <label>Ditt namn</label>
        <input type="text" id="input-name-start" placeholder="Skriv ditt namn..." maxlength="20" autocomplete="off" />
      </div>
      <div id="error-start" class="error-msg"></div>
      <button class="btn btn-primary" onclick="createRoom()">Skapa nytt spel</button>
      <div class="divider">eller</div>
      <button class="btn btn-secondary" onclick="showJoinScreen()">Gå med med rumskod</button>
    </div>
  </div>

  <!-- SKÄRM 2: Ange namn för inbjudningslänk -->
  <div id="screen-invite-name" class="screen">
    <div class="panel">
      <p class="panel-title">Du är inbjuden! 🃏</p>
      <p style="color:var(--c-muted);font-size:14px;margin-bottom:16px">Skriv in ditt namn för att gå med i spelet.</p>
      <div style="margin-bottom:16px">
        <label>Ditt namn</label>
        <input type="text" id="input-name-invite" placeholder="Skriv ditt namn..." maxlength="20" autocomplete="off" />
      </div>
      <div id="error-invite" class="error-msg"></div>
      <button class="btn btn-primary" onclick="joinRoomFromInvite()">Gå med i spelet</button>
    </div>
  </div>

  <!-- SKÄRM 3: Gå med via rumskod -->
  <div id="screen-join" class="screen">
    <div class="panel">
      <p class="panel-title">Gå med i spel</p>
      <div style="margin-bottom:12px">
        <label>Ditt namn</label>
        <input type="text" id="input-name-join" placeholder="Skriv ditt namn..." maxlength="20" autocomplete="off" />
      </div>
      <div style="margin-bottom:16px">
        <label>Rumskod</label>
        <input type="text" id="input-roomcode" placeholder="T.ex. A3B7F2C1" maxlength="8" style="font-weight:700;letter-spacing:2px" autocomplete="off" />
      </div>
      <div id="error-join" class="error-msg"></div>
      <button class="btn btn-primary" onclick="joinRoom()">Gå med</button>
      <button class="btn btn-secondary" onclick="showStartScreen()">Tillbaka</button>
    </div>
  </div>

  <!-- SKÄRM 4: Lobby -->
  <div id="screen-lobby" class="screen">
    <div class="panel" id="invite-panel" style="display:none">
      <div class="invite-box">
        <div class="invite-label">Bjud in vänner – dela länken</div>
        <div class="invite-link-row">
          <span class="invite-link" id="invite-link-text"></span>
          <button class="copy-btn" onclick="copyInviteLink()">Kopiera</button>
        </div>
      </div>
      <div id="host-settings">
        <div class="settings-row">
          <label>Max kort per spelare</label>
          <div class="stepper">
            <button onclick="changeMaxCards(-1)">−</button>
            <span class="stepper-val" id="max-cards-display">10</span>
            <button onclick="changeMaxCards(+1)">+</button>
          </div>
        </div>
      </div>
    </div>
    <div class="panel">
      <p class="panel-title">Lobby <span id="player-count" style="font-size:14px;color:var(--c-muted);font-family:var(--f-body);font-weight:400;margin-left:8px"></span></p>
      <div class="player-list" id="player-list"></div>
      <div id="error-lobby" class="error-msg"></div>
      <button class="btn btn-ready" id="btn-ready" onclick="toggleReady()">Jag är redo! 🃏</button>
      <button class="btn btn-start" id="btn-start" onclick="startGame()" disabled style="margin-top:10px;display:none">Starta Plump 🎉</button>
      <p id="waiting-msg" style="text-align:center;color:var(--c-muted);font-size:13px;margin-top:14px;display:none">
        Väntar på att alla ska bli redo
        <span class="waiting-dot">•</span><span class="waiting-dot">•</span><span class="waiting-dot">•</span>
      </p>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ── Tillstånd ────────────────────────────────────────
const state = {
  roomId: null,
  myId: null,
  isHost: false,
  isReady: false,
  maxCards: 10,
  players: [],
  pendingRoomId: null  // rumskod från URL
};

// ── Socket ───────────────────────────────────────────
const socket = io({ transports: ['websocket', 'polling'] });

socket.on('connect', () => {
  console.log('Socket ansluten:', socket.id);
  // Om vi väntar på att gå med i ett rum (kom via inbjudningslänk)
  if (state.pendingRoomId) {
    showScreen('screen-invite-name');
    document.getElementById('input-name-invite').focus();
  }
});

socket.on('room_update', (room) => {
  state.players = room.players;
  state.maxCards = room.maxCards;
  renderLobby(room);
});

socket.on('player_left', ({ name }) => {
  showToast(`${name} lämnade spelet`);
});

socket.on('game_starting', (room) => {
  // Spara spelarinfo i sessionStorage för spelvy
  const myName = document.getElementById('input-name-start')?.value?.trim()
    || document.getElementById('input-name-invite')?.value?.trim()
    || document.getElementById('input-name-join')?.value?.trim()
    || state.myName || '';

  sessionStorage.setItem('plumpState', JSON.stringify({
    roomId: state.roomId,
    myId: socket.id,
    myName: myName,
    players: room.players,
    dealer: room.currentDealer
  }));

  showToast('Spelet börjar! 🎉');
  setTimeout(() => { window.location.href = '/game.html'; }, 800);
});

// ── Routing vid sidladdning ──────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const path = window.location.pathname;
  const match = path.match(/^\/rum\/([A-Z0-9]{8})$/i);
  if (match) {
    state.pendingRoomId = match[1].toUpperCase();
    // Vänta på socket-anslutning
    if (socket.connected) {
      showScreen('screen-invite-name');
      document.getElementById('input-name-invite').focus();
    }
    // annars hanteras det i socket.on('connect')
  } else {
    document.getElementById('input-name-start').focus();
  }
});

// ── Skärmnavigering ──────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showStartScreen() { showScreen('screen-start'); }
function showJoinScreen() { showScreen('screen-join'); }

// ── Skapa rum ────────────────────────────────────────
function createRoom() {
  const name = document.getElementById('input-name-start').value.trim();
  const errEl = document.getElementById('error-start');
  if (!name) { showError(errEl, 'Skriv in ditt namn för att fortsätta.'); return; }

  socket.emit('create_room', { playerName: name, maxCards: state.maxCards }, (res) => {
    if (!res.success) { showError(errEl, res.error); return; }
    state.roomId = res.roomId;
    state.myId = socket.id;
    state.myName = name;
    state.isHost = true;

    history.pushState({}, '', `/rum/${res.roomId}`);
    const url = `${window.location.origin}/rum/${res.roomId}`;
    document.getElementById('invite-link-text').textContent = url;
    document.getElementById('invite-panel').style.display = 'block';
    document.getElementById('max-cards-display').textContent = state.maxCards;
    showScreen('screen-lobby');
  });
}

// ── Gå med via inbjudningslänk ───────────────────────
function joinRoomFromInvite() {
  const name = document.getElementById('input-name-invite').value.trim();
  const errEl = document.getElementById('error-invite');
  if (!name) { showError(errEl, 'Skriv in ditt namn.'); return; }

  socket.emit('join_room', { roomId: state.pendingRoomId, playerName: name }, (res) => {
    if (!res.success) { showError(errEl, res.error); return; }
    state.roomId = res.roomId;
    state.myId = socket.id;
    state.isHost = false;
    state.pendingRoomId = null;

    document.getElementById('invite-panel').style.display = 'none';
    showScreen('screen-lobby');
  });
}

// ── Gå med via rumskod ───────────────────────────────
function joinRoom() {
  const name = document.getElementById('input-name-join').value.trim();
  const code = document.getElementById('input-roomcode').value.trim().toUpperCase();
  const errEl = document.getElementById('error-join');
  if (!name) { showError(errEl, 'Skriv in ditt namn.'); return; }
  if (code.length !== 8) { showError(errEl, 'Rumskoden ska vara 8 tecken.'); return; }

  socket.emit('join_room', { roomId: code, playerName: name }, (res) => {
    if (!res.success) { showError(errEl, res.error); return; }
    state.roomId = res.roomId;
    state.myId = socket.id;
    state.isHost = false;

    history.pushState({}, '', `/rum/${res.roomId}`);
    document.getElementById('invite-panel').style.display = 'none';
    showScreen('screen-lobby');
  });
}

// ── Redo ─────────────────────────────────────────────
function toggleReady() {
  state.isReady = !state.isReady;
  socket.emit('set_ready', { roomId: state.roomId, ready: state.isReady });
  const btn = document.getElementById('btn-ready');
  if (state.isReady) { btn.textContent = 'Inte redo längre'; btn.classList.add('is-ready'); }
  else { btn.textContent = 'Jag är redo! 🃏'; btn.classList.remove('is-ready'); }
}

// ── Starta ───────────────────────────────────────────
function startGame() {
  socket.emit('start_game', { roomId: state.roomId }, (res) => {
    if (!res.success) showError(document.getElementById('error-lobby'), res.error);
  });
}

// ── Max kort ─────────────────────────────────────────
function changeMaxCards(delta) {
  const n = Math.min(10, Math.max(1, state.maxCards + delta));
  state.maxCards = n;
  document.getElementById('max-cards-display').textContent = n;
  socket.emit('update_settings', { roomId: state.roomId, maxCards: n });
}

// ── Rendera lobby ─────────────────────────────────────
function renderLobby(room) {
  const list = document.getElementById('player-list');
  const count = document.getElementById('player-count');
  const btnStart = document.getElementById('btn-start');
  const waitMsg = document.getElementById('waiting-msg');

  count.textContent = `${room.players.length}/7 spelare`;

  list.innerHTML = room.players.map(p => {
    const isMe = p.id === socket.id;
    const initial = p.name.charAt(0).toUpperCase();
    const badge = p.isHost
      ? `<span class="player-badge badge-host">Värd</span>`
      : p.ready
        ? `<span class="player-badge badge-ready">Redo ✓</span>`
        : `<span class="player-badge badge-waiting">Väntar…</span>`;
    return `<div class="player-item ${p.ready ? 'is-ready' : ''}">
      <div class="player-avatar">${initial}</div>
      <span class="player-name">${escHtml(p.name)}${isMe ? ' <span style="color:var(--c-muted);font-size:12px">(du)</span>' : ''}</span>
      ${badge}
    </div>`;
  }).join('');

  const allReady = room.players.length >= 2 && room.players.every(p => p.ready);
  const amHost = room.hostSocketId === socket.id;

  if (amHost) {
    btnStart.style.display = 'block';
    btnStart.disabled = !allReady;
    waitMsg.style.display = allReady ? 'none' : 'block';
    document.getElementById('invite-panel').style.display = 'block';
  } else {
    btnStart.style.display = 'none';
    waitMsg.style.display = 'block';
  }
}

// ── Kopiera länk ─────────────────────────────────────
function copyInviteLink() {
  const url = document.getElementById('invite-link-text').textContent;
  navigator.clipboard.writeText(url).then(() => showToast('Länk kopierad! 🃏'));
}

// ── Hjälpfunktioner ───────────────────────────────────
function showError(el, msg) {
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 4000);
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const active = document.querySelector('.screen.active')?.id;
  if (active === 'screen-start') createRoom();
  else if (active === 'screen-join') joinRoom();
  else if (active === 'screen-invite-name') joinRoomFromInvite();
});
</script>
</body>
</html>
